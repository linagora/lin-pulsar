name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release with standard-version
    runs-on: linagora
    container:
      image: node:22-bookworm
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.set_output.outputs.release_created }}
      version: ${{ steps.set_output.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Run release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpx standard-version

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push --atomic --follow-tags origin main

      - name: Set release outputs
        id: set_output
        run: |
          # Other tags may point at the release commit: keep only the highest release tag.
          TAGS=$(git tag --list 'v*' --points-at HEAD --sort=-v:refname)
          TAG=${TAGS%%$'\n'*}

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-and-publish:
    name: Build and publish Docker image
    runs-on: linagora
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Read OpenBao secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://obao.linagora.com
          namespace: LPS/global
          method: approle
          roleId: ${{ secrets.BAO_CLIENT_ID }}
          secretId: ${{ secrets.BAO_CLIENT_TOKEN }}
          secrets: |
            secret/data/dockerhub USERNAME | DOCKERHUB_USERNAME ;
            secret/data/dockerhub TOKEN | DOCKERHUB_TOKEN

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            linagora/lin-pulsar:latest
            linagora/lin-pulsar:${{ needs.release.outputs.version }}
